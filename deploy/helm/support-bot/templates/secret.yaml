apiVersion: v1
kind: Secret
metadata:
  name: {{ include "support-bot.secretName" . }}
  labels:
    {{- include "support-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The Secret template MUST NOT include any literal default
  # value (an empty value: is the helm idiom for "must be
  # supplied at install time"). The operator supplies keys
  # via ``--set secret.openaiApiKey=$OPENAI_API_KEY`` or
  # via an external secret manager (see CI workflow +
  # SecretStore/SecretSync alternatives).
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | quote }}
  EMBEDDING_API_KEY: {{ .Values.secret.embeddingApiKey | quote }}
  CHROMA_AUTH_TOKEN: {{ .Values.secret.chromaAuthToken | quote }}
