{{- /*
WP03: this Secret template is only rendered when useLegacySecretInlining=true
(the pre-WP03 path). The post-WP03 path uses External Secrets Operator (see
templates/externalsecret.yaml) to populate secrets from AWS Secrets Manager.
*/ -}}
{{- if .Values.useLegacySecretInlining -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "support-bot.secretName" . }}
  labels:
    {{- include "support-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | quote }}
  EMBEDDING_API_KEY: {{ .Values.secret.embeddingApiKey | quote }}
  CHROMA_AUTH_TOKEN: {{ .Values.secret.chromaAuthToken | quote }}
{{- end }}
