{{- /*
Additive template (WP03). Wires AWS Secrets Manager -> External Secrets
Operator -> Kubernetes Secret -> env var. The ClusterSecretStore authenticates
to AWS via EKS Pod Identity (the `aws.auth.jwt` block below). Each ExternalSecret
mirrors one Secrets Manager entry created by the identity module.
*/ -}}
{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region | default "eu-central-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: support-bot
---
{{- range .Values.externalSecrets.secrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval | default "1m" }}
  target:
    type: Opaque
    template:
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets-operator
  data:
    - secretKey: {{ .secretKey | default "value" }}
      remoteRef:
        key: {{ .remoteRef.key }}
        property: {{ .remoteRef.property | default "value" }}
{{- end }}
{{- end }}
