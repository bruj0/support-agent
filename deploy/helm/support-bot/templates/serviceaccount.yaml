{{- /*
Additive template (WP03). ServiceAccount with EKS Pod Identity annotation.
The `eks.amazonaws.com/pod-identityassociation-arn` annotation is filled at
tofu apply time via a helm_release override; the default value is empty so
the chart still renders without the identity module applied.
*/ -}}
{{- if .Values.serviceAccounts.enabled -}}
{{- range .Values.serviceAccounts.entries }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default "support-bot" }}
  annotations:
    eks.amazonaws.com/pod-identityassociation-arn: {{ .roleArn | default "" }}
{{- end }}
{{- end }}
