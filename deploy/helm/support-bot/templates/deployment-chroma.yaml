apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "support-bot.componentName" (list . "chroma") }}
  labels:
    {{- include "support-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "support-bot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chroma
  template:
    metadata:
      labels:
        {{- include "support-bot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:0.5.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CHROMA_SERVER_AUTH_CREDENTIALS_FILE
              value: ""
            - name: CHROMA_SERVER_AUTH_PROVIDER
              value: ""
            - name: CHROMA_SERVER_HTTP_PORT
              value: "8000"
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.chroma | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "support-bot.componentName" (list . "chroma-data") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
