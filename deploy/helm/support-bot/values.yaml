# Default values for support-bot.
# Override per environment via --values values-{dev,prod}.yaml.

image:
  repository: support-bot-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# Resource sizing for the API pod. Sized for a small dev
# cluster; values-prod.yaml overrides with larger requests.
resources:
  api:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  chroma:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Chroma vector store. The chart always co-locates Chroma
# with the API; a separate managed Chroma is supported via
# values overrides (chroma.external.enabled=true) but is
# out of scope for WP05.
chroma:
  external:
    enabled: false
    host: ""
    port: 8000

# Persistent volume for Chroma data. The PVC reclaim policy
# is set to Retain per AGENTS.md §2.4 / plan § Phase 0.
persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

# PodDisruptionBudget: minAvailable=1 keeps at least one
# replica during voluntary disruptions. Disabled by default
# (set replicaCount >= 2 to enable safely).
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# HorizontalPodAutoscaler: CPU-target based. Disabled by
# default; values-prod.yaml enables it.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60

# Ingress: disabled by default. values-prod.yaml enables it
# with a placeholder host.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: support-bot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Configuration values that go into the ConfigMap.
config:
  logLevel: INFO
  sourceUrl: ""
  embedderBackend: local
  answererBackend: openai
  # WP06 — analyzer + chunker backends. ``hybrid`` consumes
  # the analyzer output; ``openai`` drives the analyzer with
  # gpt-4o-mini by default. Set ``analyzerBackend: none`` and
  # ``chunkerBackend: fixed_size`` to revert to WP03 behavior.
  analyzerBackend: openai
  chunkerBackend: hybrid
  openaiPageAnalyzerModel: gpt-4o-mini
  lowConfidenceThreshold: "0.5"

# Secret keys: defaults to null. The WP03 identity module + the chart's
# `templates/externalsecret.yaml` populate the actual secrets at runtime via
# the External Secrets Operator (ClusterSecretStore + ExternalSecret). For
# pre-WP03 transitions or local tests, set useLegacySecretInlining=true and
# supply the secret values via --set or a sealed-secret.
secret:
  openaiApiKey: null
  embeddingApiKey: null
  chromaAuthToken: null

# WP03 toggle: defaults to false (post-WP03 path). Set to true for backward
# compat during the WP03 transition or for local helm template tests.
useLegacySecretInlining: false

# Service configuration.
service:
  api:
    type: ClusterIP
    port: 8000
  chroma:
    type: ClusterIP
    port: 8000

# Probes: point at /healthz (FR-002 / AGENTS.md §6.7).
probes:
  livenessPath: /healthz
  readinessPath: /healthz

# ----------------------------------------------------------------------------
# WP03 additive: External Secrets Operator wiring + ServiceAccount Pod Identity
# ----------------------------------------------------------------------------

# Environment name injected by tofu apply (default: dev). Used as a path
# segment in Secrets Manager entry names.
env: "dev"

# ClusterSecretStore + per-secret ExternalSecret definitions. The chart renders
# these only when `enabled: true`. The EKS Pod Identity association for the
# `external-secrets` service account is provisioned by the identity module.
externalSecrets:
  enabled: true
  region: "eu-central-1"
  refreshInterval: "1m"
  secrets:
    - name: openai-api-key
      remoteRef:
        key: "support-bot/{{ .Values.env }}/openai-api-key"
      secretKey: "OPENAI_API_KEY"
    - name: chroma-auth-token
      remoteRef:
        key: "support-bot/{{ .Values.env }}/chroma-auth-token"
      secretKey: "CHROMA_AUTH_TOKEN"

# ServiceAccounts with EKS Pod Identity association annotations. The actual
# roleArn is injected by the identity module at apply time; the chart renders
# with an empty annotation as the default so the chart still works standalone.
serviceAccounts:
  enabled: true
  entries:
    - name: external-secrets
      namespace: support-bot
    - name: adot-collector
      namespace: opentelemetry
    - name: aws-load-balancer-controller
      namespace: kube-system

# Ingress resource consumed by the AWS Load Balancer Controller. The actual
# apply is performed by the `edge` tofu module via `kubernetes_manifest`;
# this block exists so a downstream feature can install the chart and rely
# on the same ALB annotations (FR-010).
ingress:
  enabled: true
  name: support-bot-api
  scheme: internal
  targetType: ip
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  host: "{{ .Values.env }}.{{ .Values.domainSuffix }}"
  backendService: support-bot-api
  backendPort: 8000
  wafv2AclArn: ""
