# values-prod.yaml -- 3 replicas behind a PDB, HPA on CPU,
# ingress enabled, larger PVC.

env: "prod"

replicaCount: 3
config:
  logLevel: INFO
  sourceUrl: "https://replace-me.example.com/support"
  embedderBackend: local
  answererBackend: openai
  # Prod defaults: hybrid chunker + LLM analyzer enabled.
  analyzerBackend: openai
  chunkerBackend: hybrid
  openaiPageAnalyzerModel: gpt-4o-mini
  lowConfidenceThreshold: "0.5"
persistence:
  enabled: true
  size: 10Gi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

# Ingress is owned by the `edge` tofu module (kubernetes_manifest).
# Disable the chart's own Ingress template here; FR-010 annotations
# flow through the tofu code, not the chart.
ingress:
  enabled: false
  wafv2AclArn: ""
