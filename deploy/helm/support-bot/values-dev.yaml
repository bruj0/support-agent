# values-dev.yaml -- single-replica local-dev stack.

env: "dev"

replicaCount: 1
config:
  logLevel: DEBUG
  sourceUrl: "https://example.com/internet"
  embedderBackend: local
  answererBackend: openai
  # Dev defaults: cost-controlled. analyzerBackend=none keeps
  # the WP03 fixed-size chunker path so CI does not require an
  # OpenAI key.
  analyzerBackend: none
  chunkerBackend: fixed_size
  openaiPageAnalyzerModel: gpt-4o-mini
  lowConfidenceThreshold: "0.3"
persistence:
  enabled: true
  size: 1Gi
podDisruptionBudget:
  enabled: false
autoscaling:
  enabled: false

# Ingress is owned by the `edge` tofu module (kubernetes_manifest).
# Disable the chart's own Ingress template here; FR-010 annotations
# flow through the tofu code, not the chart.
ingress:
  enabled: false
