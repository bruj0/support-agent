name: infra-ci
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'deploy/helm/support-bot/templates/**'
      - 'deploy/helm/support-bot/values*.yaml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'deploy/helm/support-bot/templates/**'
      - 'deploy/helm/support-bot/values*.yaml'
jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.6.0
      - name: tofu fmt -check
        run: |
          tofu fmt -check -recursive infra/
      - name: tofu validate (bootstrap)
        working-directory: infra/bootstrap
        run: tofu init -backend=false && tofu validate
      - name: helm lint
        working-directory: deploy/helm/support-bot
        run: |
          helm lint . --values values-prod.yaml
          helm lint . --values values-dev.yaml
      - name: helm template + secret scan
        working-directory: deploy/helm/support-bot
        run: |
          helm template . --values values-prod.yaml > /tmp/rendered-prod.yaml
          helm template . --values values-dev.yaml > /tmp/rendered-dev.yaml
          cat /tmp/rendered-prod.yaml /tmp/rendered-dev.yaml | \
            ( ! grep -E 'sk-[A-Za-z0-9]{32,}' ) && \
            ( ! grep -E 'OPENAI_API_KEY=[^"]*sk-' ) && \
            ( ! grep -E 'CHROMA_AUTH_TOKEN=[^"]*[A-Za-z0-9]{8,}' )

      # WP04 (Edge & Traffic): chart's Ingress template is gated on
      # .Values.ingress.enabled; prod disables the chart's Ingress in favour of
      # the tofu kubernetes_manifest apply, but the template must still render
      # cleanly. The Ingress shape (ingressClassName=alb, the four FR-010 ALBC
      # annotations) is enforced by tofu test in infra/modules/edge.
      - name: helm template -- ingress shape sanity check
        working-directory: deploy/helm/support-bot
        run: |
          # Render with both ingress.enabled=true and ingress.enabled=false --
          # the template must produce or omit the Ingress block cleanly.
          helm template . --values values-prod.yaml --set ingress.enabled=true > /tmp/ingress-on.yaml
          helm template . --values values-prod.yaml --set ingress.enabled=false > /tmp/ingress-off.yaml
          # When enabled, exactly one Ingress must render with ingressClassName=alb.
          grep -E 'kind: Ingress' /tmp/ingress-on.yaml
          grep -E 'ingressClassName: alb' /tmp/ingress-on.yaml
          grep -E 'alb.ingress.kubernetes.io/scheme' /tmp/ingress-on.yaml
          # When disabled, NO Ingress must render from this template.
          ( ! grep -E 'kind: Ingress' /tmp/ingress-off.yaml )

      # WP05 (Data Plane & Storage): chart's PVC must bind to support-bot-gp3
      # StorageClass and carry Cluster+Component labels for DLM tag selection.
      - name: helm template -- storage class + PVC labels sanity check
        working-directory: deploy/helm/support-bot
        run: |
          helm template . --values values-prod.yaml > /tmp/rendered-prod.yaml
          helm template . --values values-dev.yaml > /tmp/rendered-dev.yaml
          grep -E 'storageClassName: support-bot-gp3' /tmp/rendered-prod.yaml
          grep -E 'storageClassName: support-bot-gp3' /tmp/rendered-dev.yaml
          grep -E 'Cluster: support-bot-prod' /tmp/rendered-prod.yaml
          grep -E 'Component: chroma' /tmp/rendered-prod.yaml
          grep -E 'Cluster: support-bot-dev' /tmp/rendered-dev.yaml

      # WP06 (Observability & Policy): chart's NetworkPolicy template must
      # render exactly 3 policies (default-deny + api-allow + chroma-allow)
      # when networkPolicies.enabled=true.
      - name: helm template NetworkPolicy count check
        working-directory: deploy/helm/support-bot
        run: |
          helm template . --values values-prod.yaml | grep -E 'kind: NetworkPolicy' | wc -l | grep -E '^[ ]*3$'
